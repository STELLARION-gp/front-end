name: Frontend Tests

on:
  pull_request:
    branches:
      - main
      - release
  push:
    branches:
      - release
      - deploy-implementation

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            echo "📦 Using package-lock.json (npm ci)"
            npm ci
          else
            echo "📦 No package-lock.json found, using npm install"
            npm install
          fi

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            echo "📦 Using package-lock.json (npm ci)"
            npm ci
          else
            echo "📦 No package-lock.json found, using npm install"
            npm install
          fi

      - name: Run TypeScript check
        run: npx tsc --noEmit

  build:
    name: Test Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            echo "📦 Using package-lock.json (npm ci)"
            npm ci
          else
            echo "📦 No package-lock.json found, using npm install"
            npm install
          fi

      - name: Build application
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000
          VITE_BACKEND_URL: http://localhost:5000
          VITE_API_ENDPOINT: /api

      - name: Check build output
        run: |
          ls -la dist/
          du -sh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: frontend/dist/
          retention-days: 7

  docker-build:
    name: Test Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: stellarion-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=http://localhost:5000
            VITE_BACKEND_URL=http://localhost:5000

      - name: Test Docker image
        run: |
          docker images | grep stellarion-frontend
